name: Qingshijiu Image First V26 Premerge Tests
on:
  push:
    branches: [diagnose/qingshijiu-api-20261108]
permissions:
  contents: read
jobs:
  premerge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qingshijiu-photo-first-v26-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static code and safe public assets
        run: |
          node --check functions/api/qingshijiu-generate.js
          node --check dist/qingshijiu/ai-content/photo-ui.js
          node --check dist/qingshijiu/ai-content/real-ai.js
          node --check src/qingshijiu-brain/evergreen-topics.js
          node scripts/verify-public-boundary.mjs
      - name: Exercise photo-first topic generator and original AI
        run: node scripts/test-qingshijiu-photo-ui.mjs
      - name: Check Cloudflare Pages function bundling
        run: npx --yes wrangler@4 pages functions build functions --outdir=/tmp/qsj-v26-functions
