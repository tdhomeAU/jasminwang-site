# Pre-merge re-test: brand cards and skill routing corrected for 面部对比
name: Qingshijiu API marketing copy smoke test
on:
  push:
    branches:
      - diagnose/qingshijiu-api-20261108
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main for static and unit tests
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check frontend and server syntax
        run: |
          node --input-type=module --check < functions/api/qingshijiu-generate.js
          node --check dist/qingshijiu/ai-content/real-ai.js
      - name: Check brand context, Song isolation and skill routing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js=fs.readFileSync('functions/api/qingshijiu-generate.js','utf8');
          const mod=await import('data:text/javascript;base64,'+Buffer.from(js).toString('base64'));
          async function run(raw,task,taskTitle){
            let sent;
            const old=globalThis.fetch;
            globalThis.fetch=async (_url,opts)=>{
              sent=JSON.parse(opts.body);
              return Response.json({choices:[{message:{content:JSON.stringify({title:'测试标题',content:'来自真实经历的测试文案示例，未涉及功效和收益',why:'验证Skill',facts:[],checks:[],imageTip:'真实图片'})}}]});
            };
            try{
              const request=new Request('https://example.com/api/qingshijiu-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw,task,taskTitle,mode:'moments'})});
              const response=await mod.onRequestPost({request,env:{DEEPSEEK_API_KEY:'test-token'}});
              const data=await response.json();
              assert.equal(response.status,200,JSON.stringify(data));
              assert.equal(data.mode,'live');
              assert.equal(data.knowledgeVersion,'QSJ-BRAND-SKILL-0.3');
              return {data,prompt:JSON.parse(sent.messages[1].content)};
            } finally {globalThis.fetch=old}
          }
          assert.ok(js.includes('【去AI味｜互联网口播语言引擎＋高级嘴替的通用人味规则】'));
          assert.ok(js.includes('品牌方负责选择发布素材及使用权限'));
          const song=await run('今天想认真介绍宋星辉的经营理念和个人转型故事','business','人物故事');
          assert.equal(song.data.skill.id,'F12');
          assert.ok(song.prompt.songXinghuiContext.includes('宋星辉'));
          const regular=await run('今天我参加了总部培训，学习如何更清楚地和客户交流自己的体验','business','团队培训');
          assert.equal(regular.data.skill.id,'F10');
          assert.equal(regular.prompt.songXinghuiContext,undefined,'Must not leak Song personal story to other dealers');
          assert.ok(regular.prompt.brandKnowledge.includes('轻拾玖'));
          const beauty=await run('今天整理了一位客户不同日期的面部对比照片，想分享真实感受','beauty','客户变化');
          assert.equal(beauty.data.skill.id,'F09');
          console.log('PASS: real marketing Skill, source knowledge, Song story isolation and F09 selection');
          JS
      - name: Probe real copy from production DeepSeek
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          sleep 18
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, sys
          cases=[
            ("moments","客户变美的故事","50岁的客户说脖子后面的富贵包看着明显小了，她特别开心，想分享给朋友们。我有这段时间的变化照片。"),
            ("video15","客户变美的故事","46岁的一位客户觉得眼周看起来很疲惫。她来体验后说护理过程很舒服，最近照镜子觉得有变化，也更开心了。")
          ]
          for mode,taskTitle,raw in cases:
            body=json.dumps({"raw":raw,"mode":mode,"style":"自然","task":"beauty","taskTitle":taskTitle},ensure_ascii=False).encode("utf-8")
            req=urllib.request.Request("https://jasminwang.com/api/qingshijiu-generate",data=body,headers={"Content-Type":"application/json"},method="POST")
            try:
              res=urllib.request.urlopen(req,timeout=42)
            except urllib.error.HTTPError as e:
              print("API STATUS ERROR",e.code,e.read(600).decode("utf-8","replace"));raise
            payload=json.loads(res.read().decode("utf-8"))
            print("RESULT",mode,"status",res.status,"version",payload.get("knowledgeVersion"),"skill",payload.get("skill"),"provider",payload.get("provider"))
            assert res.status==200
            assert payload.get("knowledgeVersion")=="QSJ-BRAND-SKILL-0.3",payload.get("knowledgeVersion")
            assert payload.get("mode")=="live"
            copy=payload.get("result",{}).get("content","")
            tip=payload.get("result",{}).get("imageTip","")
            print("COPY",copy[:800].replace("\n"," | "))
            print("IMAGE TIP",tip[:200].replace("\n"," | "))
            for val in [copy,tip]:
              bad=re.search("授权|审核|客户隐私|待核实|先不发|先不直接发|风险提示|效果不保证|未经证实|不可发布|请先确认",val)
              assert not bad, f"User-facing permission/risk chatter: {bad.group(0)}"
            assert len(copy)>25
          print("PASS: real DeepSeek marketing output, no permission/audit chatter")
          PY
