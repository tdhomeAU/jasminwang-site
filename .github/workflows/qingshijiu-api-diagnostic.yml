name: Qingshijiu Magic UI Visual Regression Check
on:
  push:
    branches: [diagnose/qingshijiu-api-20261108]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qingshijiu-magic-ui-v25-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and production bundle boundaries
        run: |
          node --check dist/qingshijiu/ai-content/magic-ui.js
          node --check dist/qingshijiu/ai-content/real-ai.js
          node scripts/verify-public-boundary.mjs
      - name: Verify all existing content factory actions and new visual assets
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root='dist/qingshijiu/ai-content/';
          const html=readFileSync(root+'index.html','utf8');
          const css=readFileSync(root+'magic-ui.css','utf8');
          const js=readFileSync(root+'magic-ui.js','utf8');
          const real=readFileSync(root+'real-ai.js','utf8');
          assert.ok(html.includes('magic-ui.css?v=25'));
          assert.ok(html.includes('magic-ui.js?v=25'));
          assert.ok(html.includes('real-ai.js?v=25'));
          for(const id of ['story','make','voice','swap','result','output','taskTitle','taskList','copy','rewrite','markDone','openAdmin','back','save','export','reset','videoAction','mediaTip']){
            assert.ok(html.includes('id="'+id+'"'),'Missing working original UI control '+id);
          }
          assert.ok(html.match(/src="data:image\/jpeg;base64,[^"]+"/),'Existing official brand photo lost');
          assert.equal((html.match(/id="make"/g)||[]).length,1);
          assert.ok(js.includes("work.insertAdjacentElement('afterend',gallery)"));
          assert.ok(js.includes('gallery-grid'));
          assert.ok(js.includes("brandImage.src"));
          assert.ok(css.includes('@media(max-width:475px)'));
          assert.ok(css.includes('prefers-reduced-motion'));
          assert.ok(real.includes("fetch('/api/qingshijiu-generate'"));
          assert.ok(real.includes('body.brain'));
          assert.ok(!js.includes('fetch('),'Presentation layer must not trigger API calls');
          console.log('PASS original controls intact; Magic UI CSS/JS, imagery and 3 illustrated cards present; DeepSeek and dual Brain preserved.');
          JS
