name: Qingshijiu Dual Brain V04 Premerge Tests
on:
  push:
    branches: [diagnose/qingshijiu-api-20261108]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qingshijiu-two-brains-v04-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify code syntax
        run: |
          node --check functions/api/qingshijiu-generate.js
          node --check src/qingshijiu-brain/brain.js
          node --check src/qingshijiu-brain/brain-data.js
          node --check dist/qingshijiu/ai-content/real-ai.js
      - name: Exercise source retrieval and Cloudflare handler using mocked provider
        run: node scripts/test-qingshijiu-brain.mjs
