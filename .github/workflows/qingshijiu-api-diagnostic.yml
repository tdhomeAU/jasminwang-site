name: Qingshijiu API non-secret deployment diagnostic
on:
  push:
    branches:
      - diagnose/qingshijiu-api-20261108
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed endpoints from GitHub runner
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          sleep 15
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          roots=["https://jasminwang.com","https://jasminwang-site.pages.dev"]
          payload=json.dumps({"raw":"今天我参加了一场团队培训，和朋友讨论了怎样认真服务客户，对方说最重视清楚透明的体验流程。","mode":"moments","style":"自然"},ensure_ascii=False).encode("utf-8")
          for root in roots:
            for method in ["GET","POST"]:
              url=root+"/api/qingshijiu-generate"
              req=urllib.request.Request(url,data=payload if method=="POST" else None,headers={"Content-Type":"application/json","User-Agent":"QSJ-API-Healthcheck/1.0"},method=method)
              try:
                res=urllib.request.urlopen(req,timeout=35)
              except urllib.error.HTTPError as exc: res=exc
              except Exception as exc:
                print(root,method,"ERROR",repr(exc));continue
              body=res.read(150000).decode("utf-8","replace")
              content_type=res.headers.get("Content-Type","")
              try:
                js=json.loads(body)
                diagnostic={"keys":list(js.keys()),"code":js.get("code"),"mode":js.get("mode"),"provider":js.get("provider"),"upstream_status":js.get("upstream_status"),"upstream_code":js.get("upstream_code"),"upstream_type":js.get("upstream_type"),"error":str(js.get("error",""))[:120]}
              except Exception:
                diagnostic={"non_json_start":body[:100].replace("\n"," ")}
              print(root,method,"http",res.status,"content_type",content_type,"bytes",len(body),"diagnostic",json.dumps(diagnostic,ensure_ascii=False))
          PY