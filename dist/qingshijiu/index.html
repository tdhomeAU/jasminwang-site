const stage=document.getElementById('stage');const homeview=document.getElementById('homeview');
const modePanel=document.getElementById('modePanel');let current='story', storeMode='off';
function decode64(s){return new TextDecoder('utf-8').decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
const pages={};
function setPage(page){
 if(!['home','story','store','ai'].includes(page))return;
 current=page;
 document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});
 modePanel.hidden=page!=='store';
 if(page==='home'){
  homeview.hidden=false;stage.hidden=true;
  document.getElementById('homeimg').src=imgData;
 }else{
  homeview.hidden=true;stage.hidden=false;
  if(!pages[page])pages[page]=decode64(html64[page]);
  stage.onload=()=>{if(page==='store')stage.contentWindow?.q9SetStoreMode?.(storeMode)};
  stage.srcdoc=pages[page];
 }
 history.replaceState(null,'','#'+page);
}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
 storeMode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===storeMode));
 if(current==='store')stage.contentWindow?.q9SetStoreMode?.(storeMode)
}));
window.addEventListener('message',e=>{if(e.source!==stage.contentWindow)return;let d=e.data;if(d?.type==='q9-nav'&&['home','story','store','ai'].includes(d.page))setPage(d.page)});
setPage(['home','story','store','ai'].includes(location.hash.slice(1))?location.hash.slice(1):'story');
</script>
