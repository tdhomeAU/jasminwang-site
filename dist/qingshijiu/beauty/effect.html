<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>高科美效果预览</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#100f0d;color:#f3ead9;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #ffd18b}a{color:inherit;text-decoration:none}.back{position:sticky;top:0;z-index:12;height:51px;display:flex;align-items:center;gap:15px;padding:0 16px;background:#12100de9;backdrop-filter:blur(12px);border-bottom:1px solid #5b462d}.back button{background:none;color:#e8c791;border:0;font-size:13px}.back strong{font-size:13px;letter-spacing:1px}.pic{width:100%;height:230px;object-fit:cover;object-position:center;display:block}.hero{padding:34px 20px 32px;background:radial-gradient(circle at 90% 12%,#a7793455,transparent 40%),linear-gradient(#2b2016,#12100d)}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#edc787;font-weight:800}.hero h1{font:800 36px/1.28 'Songti SC','SimSun',serif;color:#ffe4a5;margin:12px 0}.hero h2{font:700 22px/1.35 'Songti SC',serif;margin:10px 0;color:#fff7e9}.lead{font-size:13px;color:#e1d1b7;line-height:1.9;margin:11px 0}.accent{color:#f5ce8c;font-weight:800}section{padding:26px 18px;border-bottom:1px solid #30271e}section h2{font:700 27px/1.3 'Songti SC',serif;color:#f4d299;margin:3px 0 11px}section p{font-size:13px;line-height:1.9;color:#d5c6ad}.label{font-size:10px;color:#d6ac73;letter-spacing:2px;font-weight:800}.card{margin:14px 0;padding:17px 14px;background:linear-gradient(145deg,#302319,#191510);border:1px solid #74562d;border-radius:14px}.card h3{font-size:16px;color:#f8d89b;margin:2px 0 8px}.card p{margin:4px 0}.btn{display:inline-block;border:0;border-radius:999px;background:linear-gradient(115deg,#f8dfa9,#c89b54);padding:12px 19px;color:#39260c;font-size:13px;font-weight:800;margin-top:14px}.btn.outline{background:transparent;border:1px solid #b28f55;color:#f2d197}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid #775935;border-radius:11px;background:#241b13;padding:13px 10px}.stat strong{display:block;color:#f0c783;font-size:17px;margin-bottom:5px}.stat span{color:#d1bda2;font-size:11px;line-height:1.55}.note{font-size:11px!important;color:#ab9c85!important;line-height:1.75!important}.fine{padding:15px 18px 28px;font-size:10px;color:#b0a18e;line-height:1.8}.poster{border-radius:13px;overflow:hidden;border:1px solid #b59159;background:#79100b;margin-top:15px}.ribbon{display:grid;grid-template-columns:1fr auto;background:linear-gradient(90deg,#b4090c,#860607);margin:6px;border-radius:100px;overflow:hidden;align-items:center}.ribbon span{font-size:12px;padding:10px;color:#fff6ed;font-weight:700}.ribbon b{font-size:14px;color:#9f0b0f;background:#fff0d5;padding:11px 12px;white-space:nowrap}.muted{color:#bdac90}img{max-width:100%}
</style></head><body><header class="back"><button onclick="parent.postMessage({type:'q9-nav',page:'home'},'*')">← 返回首页</button><strong>高科美效果预览</strong></header><div class="hero"><div class="eyebrow">AI高科美 · 科技美容视觉体验</div><h1>高科美效果预览</h1><h2>先看参考变化，<br/>再了解真实护理。</h2><p class="lead">上传自己的照片，选择关心的部位，探索科技美容护理方向，了解自己的美丽需求。</p></div><section><div class="label">STEP 1 · YOUR PHOTO</div><h2>选择一张正面照片</h2><p>可选择自己的照片，探索不同护理方向的视觉参考。</p><label class="btn" style="display:inline-block">选择照片<input accept="image/*" id="photo" style="display:none" type="file"/></label><div class="card" style="text-align:center"><img alt="上传的个人照片预览" id="preview" style="display:none;max-height:280px;border-radius:10px;margin:auto"/><p id="empty">你的照片预览会显示在这里</p></div></section><section><div class="label">STEP 2 · CHOOSE A FOCUS</div><h2>想了解哪个方向？</h2><div class="grid2"><button class="stat effect" data-v="眼角细纹"><strong>眼角细纹</strong><span>纹理舒缓参考</span></button><button class="stat effect" data-v="上眼周紧致"><strong>上眼周紧致</strong><span>眼周线条参考</span></button><button class="stat effect" data-v="抬头纹"><strong>抬头纹</strong><span>额部纹理参考</span></button><button class="stat effect" data-v="面部提拉"><strong>面部提拉</strong><span>轮廓状态参考</span></button></div><div class="note" id="picked" style="margin-top:14px">请选择一个关注方向</div><div class="card"><h3>了解高科美体验</h3><p>人脸区域识别 → 局部、可控的视觉模拟 → 原图与示意图对照 → 预约实际体验。</p><p class="note">AI模拟并不预测或保证真实护理效果；不能自动据此判断适合的项目或医疗适应证。</p></div><button class="btn" onclick="parent.postMessage({type:'q9-nav',page:'free'},'*')">先预约一次真实眼周体验 →</button></section><script>const input=document.getElementById('photo'),img=document.getElementById('preview');input.addEventListener('change',()=>{const f=input.files[0];if(!f||!f.type.startsWith('image/'))return;img.src=URL.createObjectURL(f);img.style.display='block';document.getElementById('empty').style.display='none';img.onload=()=>URL.revokeObjectURL(img.src)});document.querySelectorAll('.effect').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.effect').forEach(x=>x.style.borderColor='#775935');b.style.borderColor='#f0c783';document.getElementById('picked').textContent='已选择：'+b.dataset.v+'。本版展示交互流程，尚未接入真实效果模拟引擎。'}));</script></body></html>
