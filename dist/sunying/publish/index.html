const STORAGE_KEY="freedom2027-sunying-publish-v1";
let completed={};
try{const read=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");if(read&&typeof read==="object")completed=read;}catch(e){}
const formatToday=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Melbourne",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
let selected=DATA.days.some(d=>d.date===formatToday)?formatToday:DATA.days[0].date;
let pendingOnly=false;
const allTasks=DATA.days.flatMap(day=>day.tasks);
const el=id=>document.getElementById(id);
const e=(tag,cls,txt)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node;};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(completed))}catch(err){}}
function progress(){const n=allTasks.filter(t=>completed[t.id]).length;const pct=Math.round(100*n/allTasks.length);el("progressCount").textContent=n+" / "+allTasks.length+" 已完成";el("percent").textContent=pct+"%";el("ring").style.setProperty("--p",pct+"%");}
function renderDays(){const nav=el("days");nav.replaceChildren();for(const day of DATA.days){const n=day.tasks.filter(t=>completed[t.id]).length;const done=n===day.tasks.length;const b=e("button","dayBtn"+(day.date===selected?" active":"")+(done?" complete":""));b.type="button";b.setAttribute("aria-current",day.date===selected?"date":"false");const left=e("div");left.append(e("span","name",day.day+"日"),e("span","dow",day.week));b.append(left,e("span","count",n+"/"+day.tasks.length));b.addEventListener("click",()=>{selected=day.date;pendingOnly=false;renderAll();window.scrollTo({top:0,behavior:"auto"})});nav.append(b);}}
function contentSection(s){const block=e("section","copyArea");const head=e("div","copyHead");head.append(e("strong","",s.label));const button=e("button","copyBtn","复制文案");button.type="button";button.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(s.text);button.textContent="✓ 已复制";setTimeout(()=>button.textContent="复制文案",1800);}catch(err){const x=e("textarea");x.value=s.text;x.style.position="fixed";x.style.opacity="0";document.body.append(x);x.select();const ok=document.execCommand("copy");x.remove();button.textContent=ok?"✓ 已复制":"请长按文字复制";setTimeout(()=>button.textContent="复制文案",1800);}});head.append(button);block.append(head,e("p","script",s.text));return block;}
function renderTasks(){const day=DATA.days.find(x=>x.date===selected);el("dateLabel").textContent="2026年11月"+day.day+"日 · "+day.week;el("dayTitle").textContent=day.theme;el("daySummary").textContent=day.summary;const root=el("tasks");root.replaceChildren();const selectedTasks=pendingOnly?day.tasks.filter(t=>!completed[t.id]):day.tasks;if(selectedTasks.length===0){root.append(e("div","allDone","🌷 今天的任务都完成啦！"));return;}for(const t of selectedTasks){const article=e("article","task "+t.type+(completed[t.id]?" completed":""));const head=e("div","taskHead");const left=e("div");left.append(e("span","kicker",t.label),e("h3","",t.title),e("p","summary",t.summary));const check=e("label","check");const input=e("input");input.type="checkbox";input.checked=!!completed[t.id];input.setAttribute("aria-label",t.title+" 完成状态");const labelText=e("span","",completed[t.id]?"已完成":"完成打勾");input.addEventListener("change",()=>{completed[t.id]=input.checked;save();renderAll();});check.append(input,labelText);head.append(left,check);article.append(head);for(const s of t.sections)article.append(contentSection(s));if(t.hint)article.append(e("p","note","小提醒："+t.hint));root.append(article);}}
function renderAll(){progress();renderDays();renderTasks();el("togglePending").textContent=pendingOnly?"查看全部":"只看待完成";el("togglePending").setAttribute("aria-pressed",String(pendingOnly));}
el("togglePending").addEventListener("click",()=>{pendingOnly=!pendingOnly;renderAll()});renderAll();
</script></body></html>
