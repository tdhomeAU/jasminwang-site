分享。\n第一个：555呼吸法。\n大家想想，没有空气，生命可能几分钟就受到威胁。\n可我们平时忙起来，反而很少关注自己的呼吸。\n特别是压力大、情绪紧绷的时候，可以停下来，用555呼吸法，给自己一点调整的时间。\n方法很简单，大家可以把这张图存下来，以后随时练习。❤️"}],"hint":"配图：需孙颖确认的555呼吸法步骤卡。"},{"id":"group19msg05","type":"social","label":"微信群分享 · 5/14","title":"水：咖啡与三杯水","summary":"第一晚FREE方法精华","sections":[{"label":"复制文案发微信群","text":"☕️ 第二个：喝水。\n还记得我分享的“一杯咖啡配三杯水”吗？😄\n这是我在健康学习中接触到、自己也用来提醒喝水的方法。\n最简单的办法，就是喝咖啡之前，先把水倒好，放在旁边。\n这样忙起来，也不容易忘记。\n重点是让自己养成规律喝水的习惯，而不是每次都靠意志力提醒。\n有时候一个好习惯，只需要提前做好一个小小的准备！"}],"hint":"配图：07_一杯咖啡三杯水_实拍.png。"},{"id":"group19msg06","type":"social","label":"微信群分享 · 6/14","title":"食物：圆盘筷子法","summary":"第一晚FREE方法精华","sections":[{"label":"复制文案发微信群","text":"🥗 第三个：每天怎么吃？\n我特别推荐大家试试圆盘＋筷子法则。\n其实不用把营养学想得很复杂，一个餐盘就能帮我们看清楚：\n🥬 一半蔬菜和水果\n🥚 四分之一蛋白质\n🍚 四分之一主食\n再留意一下油和酱料。\n看这张图，一目了然！\n下次吃饭，就用它来看看自己的餐盘搭配。\n不需要靠饿，先学会怎么搭配，吃饭就能变得更简单。"}],"hint":"配图：01_圆盘筷子法.png。"},{"id":"group19msg07","type":"social","label":"微信群分享 · 7/14","title":"RESET和澳洲应季生活","summary":"第一晚FREE方法精华","sections":[{"label":"复制文案发微信群","text":"🌿 另外，第一晚还有一个我很重视的概念——RESET，重新调整。\n健康不需要365天都在严格控制自己。\n我们可以在一年中安排几个关键的调整节点，重新看看自己的身体状态、饮食和生活节奏。\n这也是为什么我特别喜欢结合澳洲四季来安排健康生活。\n每个月都有不同的应季食材、生活重点和健康小窍门。\n这次先和大家分享了喝水的方法，以后我也希望每个月都能带给大家一些真正实用的应季健康建议。\n不用一次改变全部，而是让健康慢慢进入生活。\n第三阶段｜第二晚DO：火锅、圣诞、女性黄金期"}],"hint":"配图：03_澳洲四季健康.png。"},{"id":"group19msg08","type":"social","label":"微信群分享 · 8/14","title":"第二晚DO：火锅怎么吃得自在","summary":"第二晚DO生活方法","sections":[{"label":"复制文案发微信群","text":"🥂 第二晚，我们讲的是DO——真正把健康方法用进生活。\n比如咱们中国人特别喜欢吃火锅！\n其实火锅本身可以有很丰富的食物搭配，关键是怎么选。\n昨天我特别提醒大家关注四件事：\n① 汤底——根据自己的口味和需求选择\n② 食材——蔬菜、蛋白质、主食合理搭配\n③ 蘸料——注意油和酱料的用量\n④ 节奏——慢一点，留意自己的饱足感\n看这张图，以后出去吃火锅就能用！\n健康不是不让我们吃喜欢的东西，而是让我们吃得更明白、更自在。"}],"hint":"配图：02_火锅四项选择.jpg。"},{"id":"group19msg09","type":"social","label":"微信群分享 · 9/14","title":"圣诞节聚餐三步法","summary":"第二晚DO生活方法","sections":[{"label":"复制文案发微信群","text":"🎄 马上就是圣诞节了，BBQ、聚餐、旅行肯定少不了。\n我昨天分享了一个特别适合这些场合的方法：\nBefore / During / After\n🌷 Before：提前想好聚会和生活安排。\n🥂 During：好好享受，也懂得为自己选择。\n🌿 After：聚会结束，自然回到熟悉的生活节奏。\n不用因为一顿大餐就觉得前功尽弃，也不需要靠挨饿补偿。\n一顿饭学会选择，一段生活学会调整。"}],"hint":"配图：原PPT Before／During／After 第15页（已有PPT，截整页）。"},{"id":"group19msg10","type":"social","label":"微信群分享 · 10/14","title":"女性黄金期：孙颖自己的觉察","summary":"第二晚DO生活方法","sections":[{"label":"复制文案发微信群","text":"🌸 第二晚还有一个我自己当下特别关注的话题——女性黄金期。\n我昨天说过一句话：\n女性的黄金期，不是一张年龄表，而是越来越懂得照顾自己的身体。\n回头看我自己这20多年的健康探索，也经历了不同阶段。\n年轻的时候，我最关注的是减重、身材。\n后来，我更在意自己的身体状态、精力和生活品质。\n而到了现在这个阶段，我开始特别关注女性的生理周期、经期前后的变化，以及围绝经期的健康管理。\n这也是我今年对自己的一个重要觉察。\n大家看这张图，从生理周期、围绝经期到绝经以后，每个阶段都有不同的关注重点。\n真正好的健康方法，一定是能够跟着我们的年龄、身体和生活一起调整、一起升级的。❤️\n第四阶段｜Mastery、日历与HERS升级"}],"hint":"配图：05_女性黄金期参考图.jpg。"},{"id":"group19msg11","type":"social","label":"微信群分享 · 11/14","title":"Mastery到2027专属健康日历","summary":"2027 HERS升级","sections":[{"label":"复制文案发微信群","text":"📅 讲到这里，就来到FREEDOM最后一个部分——Mastery。\n我的理解是：真正掌握健康，不只是知道方法，而是有能力为自己的生活做主。\n而要做到这一点，我们还需要一个真正用得上的工具。\n市面上健康日历、营养建议其实很多，但我一直没找到一份真正适合我们澳洲华人女性、能结合自己身体阶段、澳洲四季和个人生活安排的日历。\n既然找不到，那我们就自己来做！😄\n所以，我决定把这20多年积累的FREEDOM方法，结合2027年澳洲12个月的季节、食材和生活主题，做成一份真正属于我们的健康生活日历。\n更开心的是，这也会成为2027年HERS会员的一份特别礼物！❤️"}],"hint":"配图：04_2027十二种自由年度总览.jpg。"},{"id":"group19msg12","type":"social","label":"微信群分享 · 12/14","title":"2027 HERS全新升级：三项价值","summary":"2027 HERS升级","sections":[{"label":"复制文案发微信群","text":"🌷 也正因为这个想法，2027年HERS女性幸福圈将迎来一次全新升级！\n我特别期待和大家一起做好三件事：\n📅 第一，拥有自己的专属健康生活日历。\n结合FREEDOM方法、澳洲四季和自己的生活节奏，每个月都有应季健康主题、实用建议和健康小窍门。\n🌸 第二，把12种自由真正活出来。\n我们规划了全年12个月的生活主题，也计划安排12场线下主题活动，让大家一起体验健康、美丽、成长和更多精彩的澳洲生活。\n💕 第三，拥有一个高质量的女性成长与资源分享圈。\n每个月有主题交流、资源分享，也能认识更多关注健康、热爱生活、有阅历、有智慧的澳洲女性。\n不只是一起学习，而是真的一起体验、一起成长，把2027年过得更精彩！\n第五阶段｜报名邀请"}],"hint":"配图：06_HERS真实生活场景拼图.jpg。"},{"id":"group19msg13","type":"social","label":"微信群分享 · 13/14","title":"感谢支持：为什么给特别优惠（不提前报价格）","summary":"会员邀请与报名","sections":[{"label":"复制文案发微信群","text":"姐妹们，最后我还想说几句心里话。❤️\n这两晚大家的支持和鼓励，真的让我特别感动！\n2027年HERS的这次升级，我特别希望不是我一个人把所有事情做好，再邀请大家来参加，而是从一开始，就有一群志同道合的姐妹一起参与、一起创造。\n所以这次，我特别为本群的姐妹准备了一份力度很大的首批共创优惠。\n就是想降低大家参与的门槛，让更多真正认同这个理念的姐妹，能够和我们一起把2027年的精彩生活做出来！💕"}],"hint":""},{"id":"group19msg14","type":"social","label":"微信群分享 · 14/14","title":"正式权益、价格、赠礼和报名（已按11月19 function renderDays(){

 for(const day of DATA.days){
  const n=day.tasks.filter(t=>completed[t.id]).length,done=n===day.tasks.length;

async function syncWorkshopNotes(){
 if(!workshopToken)return;
 setWorkshopStatus("正在从共享笔记库读取最新记录……");
 try{
  const response=await fetch("/api/sunying/workshop-notes",{headers:{"Authorization":"Bearer "+workshopToken},cache:"no-store"});
  const data=await response.json();
  if(!response.ok||!data.ok)throw Error(data.error||"连接失败");
  workshopConnected=true;
  let count=0;
  for(const row of data.notes||[]){if(!workshopDirty[row.section_key]){workshopDrafts[row.section_key]=row.note;const textarea=el("ws-"+row.section_key);if(textarea)textarea.value=row.note;}count++;}
  saveWorkshopDraft();setWorkshopStatus("✓ 已连接共享笔记 · 云端有 "+count+" 条记录（如刚做过本机修改，请点击各环节「保存笔记」）");
 }catch(error){workshopConnected=false;setWorkshopStatus("共享同步未连接 · 本机仍可暂存。请确认数据库部署后点击「同步最新反馈」。");}
}

 const area=el("ws-"+key);if(!area)return;
 const note=area.value;workshopDrafts[key]=note;saveWorkshopDraft();
 if(!workshopEditor){setNoteState(key,"请先在上方填写记录人，笔记已暂存本机");return;}
 setNoteState(key,"同步中……");
 try{
  const response=await fetch("/api/sunying/workshop-notes",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+workshopToken},body:JSON.stringify({section:key,note,editor:workshopEditor})});
  const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||"保存失败");
  if(area.value===note){workshopDirty[key]=false;writeStorage(dirtyKey(),JSON.stringify(workshopDirty));setNoteState(key,"✓ 已保存共享 · "+workshopEditor+" · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));}else{setNoteState(key,"刚有新修改 · 正在准备再次同步");}workshopConnected=true;setWorkshopStatus("✓ 已连接共享笔记 · 保存成功");
 }catch(error){setNoteState(key,"未同步 · 内容已暂存本机，请稍后重试");setWorkshopStatus("云端暂时未能保存，笔记仍在此设备中。");}
}
(function initWorkshop(){
 const hashValue=location.hash.startsWith("#notes=")?decodeURIComponent(location.hash.slice(7)):"";
 workshopToken=/^[A-Za-z0-9_-]{32}$/.test(hashValue)?hashValue:readStorage(NOTES_TOKEN_KEY,"");
 if(!/^[A-Za-z0-9_-]{32}$/.test(workshopToken))workshopToken=newWorkshopToken();
 writeStorage(NOTES_TOKEN_KEY,workshopToken);
 workshopEditor=readStorage(NOTES_EDITOR_KEY,"");
 try{const x=JSON.parse(readStorage(draftKey(),"{}"));if(x&&typeof x==="object")workshopDrafts=x;}catch(_){}
 try{const d=JSON.parse(readStorage(dirtyKey(),"{}"));if(d&&typeof d==="object")workshopDirty=d;}catch(_){}
 el("workshopTab").addEventListener("click",()=>{showWorkshop();window.scrollTo({top:0,behavior:"auto"})});
 if(hashValue)showWorkshop();
})();

</script></body></html>
