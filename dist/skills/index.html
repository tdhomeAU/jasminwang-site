  <body>
    <header class="site-header">
      <div class="shell nav">
        <a class="brand" href="./" aria-label="澳洲茉莉 AI 技能库">
          <span class="brand-mark" aria-hidden="true">JW</span>澳洲茉莉
        </a>
        <span class="nav-label">AI 技能库</span>
      </div>
    </header>

    <main>
      <section class="shell hero library-hero">
        <div>
          <p class="eyebrow">Methods made executable</p>
          <h1 class="hero-statement"><span>把想法变成方法，</span><span>把方法交给 AI，</span><span class="coral-line">把成果真正做出来。</span></h1>

          <h2>澳洲茉莉 AI 技能库</h2>

      <section class="shell category-nav-wrap" id="skill-library" aria-label="Skill 分类">
        <div class="category-nav" data-category-nav>
          <button
            class="category-filter is-active"
            type="button"
            data-filter="all"

        </div>
        <div class="library-actions">
          <button data-download-all type="button" disabled>下载全部技能包</button>
        </div>
      </section>

      <div class="shell catalog" data-catalog></div>

    <footer class="site-footer">

        <span>© 2026 澳洲茉莉 · Jasmin Wang</span>
